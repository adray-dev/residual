<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The layout width stays 1440 — the canvas this tool was drawn and tested at — because
         its composition does not reflow, and a phone should get the real thing rather than an
         untested one. What changes is only how much of it you see at once: `initial-scale=1`
         opens at true size, legible and pannable, instead of fitting all 1440px into a 390px
         screen, which was the "massive screen" problem — everything present, nothing readable.
         `minimum-scale` still allows pinching back out to the whole layout.

         Note this also fixes the layout viewport at 1440 on every device, so CSS media
         queries always see 1440 and can never fire on a phone. Scale is the only lever here;
         a breakpoint-based mobile layout would need this width released first.

         Desktop browsers ignore this element entirely, so none of it reaches one. -->
    <meta
      name="viewport"
      content="width=1440, initial-scale=1, minimum-scale=0.2, maximum-scale=5, user-scalable=yes"
    />
    <title>Residual — Building on every block</title>
    <meta
      name="description"
      content="Residual evaluates every parcel within a given geography to identify its most financially feasible use, surfacing prime development opportunities across an entire city."
    />
    <meta property="og:title" content="Residual — Building on every block" />
    <meta
      property="og:description"
      content="Residual evaluates every parcel within a given geography to identify its most financially feasible use, surfacing prime development opportunities across an entire city."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
