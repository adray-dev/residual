<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The layout viewport is the device's own width. A pinned width (this was 1440) hands a
         phone the desktop composition to pan around, which fails three ways at once: nothing
         can be sized to a screen CSS cannot measure, every media query reports the pinned
         width so no mobile rule can ever fire, and the map is a canvas rendered for 1440 that
         the browser then rescales — which is what made it blurry. Releasing it lets the
         breakpoints in App.module.css do the work, and lets MapLibre render at the device's
         real pixel ratio. No maximum-scale, so pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Residual — Building on every block</title>
    <meta
      name="description"
      content="Residual evaluates every parcel within a given geography to identify its most financially feasible use, surfacing prime development opportunities across an entire city."
    />
    <meta property="og:title" content="Residual — Building on every block" />
    <meta
      property="og:description"
      content="Residual evaluates every parcel within a given geography to identify its most financially feasible use, surfacing prime development opportunities across an entire city."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
