<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #101817; }
    a { color: #C4187E; } a:hover { color: #e0439f; }
  </style>
  <script>window.OM_SCENES = '[{"name":"Emerge","dur":1.4,"desc":"The six lots appear and take their first positions"},{"name":"Assemble","dur":1.2,"desc":"The lots settle and align into the final grid"},{"name":"Residual","dur":0.8,"desc":"The magenta residual lot ignites, calling out the payoff parcel"},{"name":"Hold","dur":0.6,"desc":"The mark settles and the wordmark fades in"}]';</script>
  <script>window.OM_PLAYBACK = '{"mode":"times","count":1}';</script>
</helmet>
<div style="width:100%;height:100vh;">
  <x-import component-from-global-scope="CompositionStage" from="./animations-v3.jsx" hint-size="1600px,900px" width="1600" height="900" scenes="{{ scenes }}" playback="{{ playback }}">
    <x-import component-from-global-scope="ResidualLoader" from="./ResidualLoader.jsx" hint-size="100%,100%" variant="{{ variant }}" show-tagline="{{ showTagline }}"></x-import>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;4&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;showTagline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      scenes: window.OM_SCENES,
      playback: window.OM_PLAYBACK,
      variant: this.props.variant ?? '1',
      showTagline: this.props.showTagline ?? true,
    };
  }
}

</script>
</body>
</html>
