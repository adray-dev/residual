[project]
name = "feasibility"
version = "0.1.0"
description = "Per-parcel development feasibility engine (DC pilot)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "numpy-financial>=1.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
data = [
  "python-dotenv>=1.0",   # data/repositories.py auto-loads .env for every entry point
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "psycopg[binary]>=3.1",
  "SQLAlchemy>=2.0",
  "requests>=2.31",
]
api = [
  "openpyxl>=3.1",       # the live-formula Excel export (api/workbook.py)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg-pool>=3.2",
]
dev = [
  "formulas>=1.3",        # recomputes the xlsx export to check it against the engine
  "pytest>=8.0",
  "httpx>=0.27",          # fastapi.testclient
  "feasibility[data,api]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "data", "bake", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
