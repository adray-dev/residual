[project]
name = "feasibility"
version = "0.1.0"
description = "Per-parcel development feasibility engine (DC pilot)"
requires-python = ">=3.11"
# Everything the app needs to SERVE a request, and nothing else. Vercel installs exactly
# this list — it reads `[project] dependencies` and does not resolve extras, so anything
# the API imports at runtime has to be declared here rather than behind an extra. The
# loader-only packages are still optional; they are most of the install size and the
# serving path never imports them.
dependencies = [
  # Engine — pure computation, no I/O.
  "numpy>=1.26",
  "numpy-financial>=1.0",
  "scipy>=1.11",
  # API surface.
  "fastapi>=0.110",
  "openpyxl>=3.1",        # the live-formula Excel export (api/workbook.py)
  # data/repositories.py, which is the only module that touches the database.
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "python-dotenv>=1.0",   # repositories.py auto-loads .env for every entry point
]

[project.optional-dependencies]
data = [
  "python-dotenv>=1.0",   # data/repositories.py auto-loads .env for every entry point
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "psycopg[binary]>=3.1",
  "SQLAlchemy>=2.0",
  "requests>=2.31",
]
api = [
  # Only the server. The API's actual libraries moved to `[project] dependencies` above
  # so that Vercel, which installs from that list alone, gets them. What is left here is
  # what a container needs and a function does not: Vercel invokes the ASGI app directly,
  # so it never runs uvicorn. `pip install .[api]` still builds the serving image.
  "uvicorn>=0.29",
]
dev = [
  "formulas>=1.3",        # recomputes the xlsx export to check it against the engine
  "pytest>=8.0",
  "httpx>=0.27",          # fastapi.testclient
  "feasibility[data,api]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Vercel would find `api/main.py` on its own — it is one of the filenames scanned — but
# `engine/` and `data/` also sit at the root and naming the entrypoint outright removes
# any question of which module gets loaded as the function.
[tool.vercel]
entrypoint = "api.main:app"

[tool.setuptools]
packages = ["engine", "data", "bake", "api", "tiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
