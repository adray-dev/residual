[project]
name = "feasibility"
version = "0.1.0"
description = "Per-parcel development feasibility engine (DC pilot)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "numpy-financial>=1.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
data = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "psycopg[binary]>=3.1",
  "SQLAlchemy>=2.0",
  "requests>=2.31",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "feasibility[data,api]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "data", "bake", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
